<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Chatbot</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --accent:#3b5bdb; --bot:#eef1f9; --text:#1f2430; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:16px; }
  .chat { width:100%; max-width:640px; height:calc(100vh - 32px); background:var(--card); border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.08); display:flex; flex-direction:column; overflow:hidden; }
  header { padding:14px 18px; background:var(--accent); color:#fff; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:6px; padding:4px 10px; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:10px 13px; border-radius:12px; line-height:1.45; white-space:pre-wrap; }
  .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:3px; }
  .user { background:var(--accent); color:#fff; align-self:flex-end; border-bottom-right-radius:3px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:999px; padding:4px 10px; font-size:.82rem; cursor:pointer; }
  .fb { margin-top:6px; font-size:.8rem; opacity:.8; }
  .fb button { border:0; background:transparent; cursor:pointer; font-size:1rem; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #e5e8f0; }
  input { flex:1; padding:11px 13px; border:1px solid #cfd5e3; border-radius:10px; font-size:1rem; }
  form button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:0 18px; font-size:1rem; cursor:pointer; }
</style>
</head>
<body>
<div class="chat">
  <header><span>Support Assistant</span><button id="reset" type="button">New chat</button></header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="input" autocomplete="off" maxlength="1000" placeholder="Ask about orders, returns, payments..." aria-label="Message">
    <button type="submit">Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
let sessionId = null;
try { sessionId = localStorage.getItem('chat_session'); } catch (e) {}

function add(text, who) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function send(text) {
  add(text, 'user');
  try {
    const res = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session_id: sessionId})
    });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    sessionId = data.session_id;
    try { localStorage.setItem('chat_session', sessionId); } catch (e) {}
    const el = add(data.reply, 'bot');

    if (data.suggestions.length) {
      const chips = document.createElement('div'); chips.className = 'chips';
      data.suggestions.forEach(s => {
        const c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = s;
        c.onclick = () => send(s); chips.appendChild(c);
      });
      el.appendChild(chips);
    }
    if (data.intent === 'faq') {
      const fb = document.createElement('div'); fb.className = 'fb'; fb.append('Was this helpful? ');
      [['👍', true], ['👎', false]].forEach(([icon, val]) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = icon;
        b.onclick = async () => {
          await fetch('/feedback', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({message_id: data.message_id, helpful: val})});
          fb.textContent = 'Thanks for the feedback!';
        };
        fb.appendChild(b);
      });
      el.appendChild(fb);
    }
  } catch (err) {
    add('Sorry, something went wrong. Please try again.', 'bot');
  }
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
});
document.getElementById('reset').onclick = () => {
  sessionId = null; try { localStorage.removeItem('chat_session'); } catch (e) {}
  log.innerHTML = ''; add('New conversation started. How can I help?', 'bot');
};
add('Hi! I can help with orders, returns, payments, shipping and your account. What do you need?', 'bot');
</script>
</body>
</html>
